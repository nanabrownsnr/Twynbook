# Add this inside the server { } block that proxies to TwynBook.
# 405: proxy /api/ to backend first so POST (signup/login) works; then SPA/static below.
# 413: allow larger uploads (selfie + voice).
# 504: persona create (60s idle video) can take several minutes; increase proxy timeouts.
#
# IMPORTANT: WebSocket Upgrade + Connection headers are required for:
#   - /webrtc/signaling  (WebRTC signaling)
#   - /webrtc/push       (backend → media server push)
#   - /api/personas/.../chat/stream  (chat streaming WS)

location /webrtc/ {
    proxy_pass http://127.0.0.1:8087;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25M;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

location /api/ {
    proxy_pass http://127.0.0.1:8087;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25M;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

# Then keep your existing location / { ... } for the app (same proxy_pass + headers + timeouts).
