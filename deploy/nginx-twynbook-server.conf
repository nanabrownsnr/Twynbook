# Server block for twynbook.4th-ir.com
# Copy into /etc/nginx/sites-available/ and symlink from sites-enabled.
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: location /api/ MUST appear before location / so POST requests
# (signup, login, persona create, etc.) reach the FastAPI backend.
#
# WebSocket: Upgrade + Connection headers are REQUIRED for:
#   - /webrtc/signaling  (WebRTC signaling)
#   - /webrtc/push       (backend → media server push)
#   - /api/personas/.../chat/stream  (chat streaming WS)

server {
    listen 80;
    listen [::]:80;
    server_name twynbook.4th-ir.com;
    # If using HTTPS (recommended), add listen 443 ssl; and ssl_* directives.

    client_max_body_size 25M;

    # WebRTC signaling + push (WebSocket)
    location /webrtc/ {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # API: all /api/* requests (GET, POST, PUT, DELETE + WebSocket chat/stream)
    location /api/ {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # App: SPA and static files
    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
