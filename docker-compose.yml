# TwynBook: single container (frontend + backend)
# Uses .env in this folder for OLLAMA_URL, CHATTERBOX_BASE_URL, DITTO_API_URL, etc.
# Build: docker compose build
# Run:   docker compose up -d
# App:   http://localhost:8087  (API at /api, frontend at /)
#
# WebRTC requires the server to advertise an IP the browser can reach. With bridge
# networking the container advertises 172.x.x.x, which the client cannot reach, so ICE fails.
# network_mode: host makes the app use the host's network stack so ICE candidates are
# the host's real IP (e.g. 192.168.x.x or your public IP). App listens on host:8087.
#
# To reach Ditto/Chatterbox on the host from inside the container, use 127.0.0.1 when
# using host network (same machine). Ditto: local `ditto-api` from ditto-talkinghead compose is published on host 8082 (see DITTO_API_URL below).

services:
  app:
    build: .
    image: twynbook:latest
    container_name: twynbook
    runtime: runc
    network_mode: host
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - STATIC_DIR=/app/static
      - DITTO_STREAMING=1
      - DITTO_API_URL=http://127.0.0.1:8082
      - DITTO_API_URLS=http://127.0.0.1:8082
      # Streaming Ditto: faces saved under DATA_DIR/ditto_faces; Ditto fetches via HTTP from the host (see env.example).
      - DITTO_FACE_FETCH_BASE_URL=${DITTO_FACE_FETCH_BASE_URL:-http://172.17.0.1:8087}
      - DITTO_INTERNAL_FACE_SECRET=${DITTO_INTERNAL_FACE_SECRET:-}
      # WebRTC media server is same process at /webrtc; backend pushes segments here
      - MEDIA_SERVER_WS_URL=ws://localhost:8087/webrtc
      - STT_BASE_URL=http://127.0.0.1:8090
      # Default chatterbox; set TTS_PROVIDER=qwen3 in .env to use Qwen3-TTS on host port 8001
      - TTS_PROVIDER=${TTS_PROVIDER:-chatterbox}
      - QWEN3_TTS_BASE_URL=${QWEN3_TTS_BASE_URL:-http://127.0.0.1:8001}
      - COSYVOICE_USE_TRITON=0
      - COSYVOICE_USE_CACHE=0
      - COSYVOICE_BASE_URL=
      - COSYVOICE_USE_REGISTERED_SPK=1
      - COSYVOICE_USE_SFT=0
      - COSYVOICE_SPEED=1.0
      - COSYVOICE_USE_TRITON=0
      - COSYVOICE_TRITON_URL=http://127.0.0.1:18001
      - COSYVOICE_TRITON_MODEL=cosyvoice2
      - COSYVOICE_TRITON_OFFLINE=0
      - COSYVOICE_REF_TEXT_MODE=short
      - COSYVOICE_USE_CACHE=0
      - COSYVOICE_CACHE_ALL_ON_STARTUP=1
      - COSYVOICE_CACHE_WARMUP_TEXT=Hello.
      - MIN_VOICE_SECONDS=15
      - MAX_VOICE_SECONDS=20
      - MIN_SPEECH_RATIO=0.6
      - AUDIO_GAIN=2.0
      - AUDIO_PREFILL_MS=200
      - AUDIO_CONTINUOUS=0
      - AUDIO_CLIP_MIN_CHARS=0
      - AUDIO_FIRST_CLIP_SENTENCES=1
      # Video: merge LLM sentences until at least VIDEO_CLIP_MIN_CHARS (short "Hi." + "How are you?" → one Ditto clip).
      - VIDEO_CLIP_MIN_CHARS=52
      - VIDEO_CLIP_MAX_SENTENCES=8
      # If VIDEO_CLIP_MIN_CHARS=0, fall back to fixed batch size:
      - VIDEO_SENTENCES_PER_CLIP=2
      - AUDIO_SENTENCES_PER_CLIP=1
      # Video uses the same sentence batching as audio (AUDIO_FIRST_*); Ditto runs after TTS only.
      - XTTS_BASE_URL=http://127.0.0.1:8002
      - CHATTERBOX_BASE_URL=http://127.0.0.1:8000
      - TURN_URL=turn:178.194.34.219:3478?transport=udp,turn:178.194.34.219:3478?transport=tcp
      - TURN_USERNAME=twynbook
      - TURN_PASSWORD=twynbook
      - OLLAMA_URL=http://127.0.0.1:11434
      - OLLAMA_MODEL=qwen2.5:3b
      # Trim WebSocket chat context (excluding system): last N user/assistant pairs worth of messages.
      - CHAT_HISTORY_MAX=5
      # Ask Ollama to keep the chat model loaded between requests (OpenAI compat keep_alive); pairs with server OLLAMA_KEEP_ALIVE.
      - OLLAMA_KEEP_ALIVE_REQUEST=15m
      # KB embeddings default to OLLAMA_MODEL in app code. Override with RAG_OLLAMA_EMBED_MODEL only if you use a dedicated embed model.
      - OLLAMA_ENABLE_TOOLS=1
      - OLLAMA_MAX_TOOL_ROUNDS=3
      # LLM first-token / per-sentence wait (default 120s in code); avoids 0-clip video when Ollama is slow.
      - CHAT_LLM_QUEUE_TIMEOUT_SEC=180
      # RTC STT VAD: min_ms alone cannot be huge or short words never flush; use fallback with stricter long silence + noise_min.
      - RTC_VAD_RMS_THRESHOLD=0.020
      - RTC_VAD_MIN_SPEECH_MS=550
      # Silence needed before a segment is cut and sent to STT; too low = cuts you off mid-thought on short pauses.
      - RTC_VAD_SILENCE_MS=980
      - RTC_VAD_LONG_SILENCE_MS=2200
      - RTC_VAD_NOISE_MIN_MS=380
      - RTC_VAD_ENABLE_SHORT_FALLBACK=1
      # TTS→Ditto f32 pads (ms). Default off in code; enable only if clip-boundary mux pops return.
      - DITTO_SILENCE_PRE_MS=0
      - DITTO_SILENCE_POST_MS=0
    volumes:
      - twynbook-data:/app/data
    restart: unless-stopped

  stt-whisper:
    build:
      context: ./stt_service
    image: stt-whisper:latest
    container_name: stt-whisper
    runtime: nvidia
    network_mode: host
    restart: unless-stopped
    environment:
      - STT_MODEL=small.en
      - STT_DEVICE=cuda
      - STT_COMPUTE_TYPE=float16
      - STT_VAD_FILTER=false
      # GPU 0 with ditto-api (ditto-talkinghead). Ollama runs on GPU 2 (local-ai-stack); Chatterbox on GPU 1.
      - NVIDIA_VISIBLE_DEVICES=0

  turn:
    image: instrumentisto/coturn:latest
    container_name: coturn
    network_mode: host
    restart: unless-stopped
    command:
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--realm=twynbook"
      - "--user=twynbook:twynbook"
      - "--external-ip=178.194.34.219"
      - "--min-port=49152"
      - "--max-port=49200"

  mongodb:
    image: mongo:latest
    container_name: mongodb
    network_mode: host
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db

  # Chatterbox voice clones live under /app/uploaded_voices and /app/voices — mount host dirs so container
  # restarts do not wipe voices. Image name matches common local build (override with CHATTERBOX_IMAGE if needed).
  #
  # If TTS returns HTTP 500 with "CUDA out of memory" in chatterbox logs, Chatterbox is sharing a GPU with
  # Ditto/streaming — keep NVIDIA_VISIBLE_DEVICES on a different GPU than Ditto, or stop other GPU workloads.
  # "Connection refused" to localhost:27017 means MongoDB is not listening on the host; start the `mongodb`
  # service above or fix MONGODB_URI in docker-data/.env.chatterbox.runtime.
  chatterbox:
    image: ${CHATTERBOX_IMAGE:-app-chatterbox-api:latest}
    container_name: chatterbox-api
    runtime: nvidia
    network_mode: host
    restart: unless-stopped
    # Regenerate before first `compose up chatterbox`: see scripts/export-chatterbox-env.sh
    env_file:
      - ./docker-data/.env.chatterbox.runtime
    environment:
      - MONGODB_URI=mongodb://localhost:27017
      # GPU 1: Chatterbox only. Ollama is on GPU 2 (local-ai-stack); Ditto+STT on GPU 0.
      - NVIDIA_VISIBLE_DEVICES=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    # Host dirs must be writable by the container user (often uid 1000). If Chatterbox crashes on startup
    # with PermissionError on /app/logs, run once: chmod -R a+rwx ./docker-data/chatterbox
    volumes:
      - ./docker-data/chatterbox/uploaded_voices:/app/uploaded_voices
      - ./docker-data/chatterbox/voices:/app/voices
      - ./docker-data/chatterbox/uploads:/app/uploads
      - ./docker-data/chatterbox/logs:/app/logs

volumes:
  twynbook-data:
  mongodb-data:
